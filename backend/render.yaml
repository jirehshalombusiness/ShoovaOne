services:
  - type: web
    name: shoova-one-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      python render_db_setup.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shoova_one_db
          property: connectionString
    databases:
      - name: shoova_one_db
        databaseName: shoova_one
        user: shoova

  - type: database
    name: shoova_one_db
    plan: starter
    region: oregon