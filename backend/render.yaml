services:
  - type: web
    name: shoova-one-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: |
      chmod +x render-build.sh
      ./render-build.sh
    startCommand: |
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_EXPIRATION_MINUTES
        value: "720"
      - key: BACKEND_CORS_ORIGINS
        value: https://shoovaone.vercel.app,https://www.shoovainitiative.com,https://apply.shoovainitiative.org,https://www.shoovainitiative.org
      - key: FRONTEND_URL
        value: https://www.shoovainitiative.com
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_FROM
        value: Shoova ONE <notifications@shoove.org>
      - key: EMAIL_REPLY_TO
        value: people@shoove.org
      - key: RESEND_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPERADMIN_EMAIL
        value: admin@shoova.org
      - key: SUPERADMIN_FIRST_NAME
        value: Super
      - key: SUPERADMIN_LAST_NAME
        value: Admin
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: shoova_one_db
          property: connectionString
    databases:
      - name: shoova_one_db
        databaseName: shoova_one
        user: shoova